# Rick's crew: n8n runs the crew's jobs; each job asks its own local Ollama model.
# Started by the crew-n8n user service. Data lives on the NVMe (~/AppData/n8n) since 2026-10-15.
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: crew-n8n
    restart: "no"
    network_mode: host   # reaches Ollama (11434) and the crew API (8899) on 127.0.0.1
    env_file: ${HOME}/AppData/n8n-ai.env   # n8n AI helper → brain switch (holds key, chmod 600)
    environment:
      N8N_LISTEN_ADDRESS: 127.0.0.1
      N8N_PORT: "5678"
      N8N_HOST: 127.0.0.1
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: America/New_York
      TZ: America/New_York
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_HIRING_BANNER_ENABLED: "false"
    volumes:
      - ${HOME}/AppData/n8n:/home/node/.n8n
      - ./workflows:/workflows:ro
