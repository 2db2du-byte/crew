# Rabbid's "brain switch" (LiteLLM). One OpenAI-style address, 127.0.0.1:4000/v1, for every AI on the laptop.
# Each job name tries its free cloud brains in `order`; if one is out of free uses or the internet is down, the next
# one answers; with no internet at all it lands on the local Ollama models. Keys come from ~/.config/crew/ai-keys.env.
# Built 2026-10-06. Cerebras + Together skipped (want a card); GitHub Models dropped: GitHub retired it 2026-07-30 (it only answers "OK").

x-cf: &cf
  api_base: os.environ/CLOUDFLARE_AI_BASE
  api_key: os.environ/CLOUDFLARE_API_TOKEN

# Added 2026-10-08. NVIDIA NIM: free, ~40 requests/min for the whole account. Ollama Cloud free plan: only gpt-oss,
# gemma4:31b and nemotron-3-super; ONE request at a time and unpublished 5-hour/weekly limits, so it stays a backup.
x-nim: &nim
  api_base: https://integrate.api.nvidia.com/v1
  api_key: os.environ/NVIDIA_NIM_API_KEY
x-ollama-cloud: &ollamacloud
  api_base: https://ollama.com/v1
  api_key: os.environ/OLLAMA_API_KEY

model_list:
  # ---------- free-chat: everyday answers ----------
  - model_name: free-chat
    litellm_params: { model: groq/openai/gpt-oss-120b, api_key: os.environ/GROQ_API_KEY, order: 1 }
  - model_name: free-chat
    litellm_params: { model: gemini/gemini-flash-latest, api_key: os.environ/GEMINI_API_KEY, order: 2 }
  - model_name: free-chat
    litellm_params: { model: openai/@cf/meta/llama-3.3-70b-instruct-fp8-fast, <<: *cf, order: 3 }
  - model_name: free-chat
    litellm_params: { model: openrouter/google/gemma-4-31b-it:free, api_key: os.environ/OPENROUTER_API_KEY, order: 4 }
  - model_name: free-chat
    litellm_params: { model: mistral/mistral-small-latest, api_key: os.environ/MISTRAL_API_KEY, order: 5 }
  - model_name: free-chat
    litellm_params: { model: openai/z-ai/glm-5.3, <<: *nim, order: 6 }
  - model_name: free-chat
    litellm_params: { model: openai/gpt-oss:120b, <<: *ollamacloud, order: 7 }
  # 2026-10-16: more free Cloudflare models (Workers Free plan; Kimi/GLM/DeepSeek there are paid-only). Late in line to save neurons.
  - model_name: free-chat
    litellm_params: { model: openai/@cf/mistralai/mistral-small-3.1-24b-instruct, <<: *cf, order: 8 }
  - model_name: free-chat
    litellm_params: { model: openai/@cf/qwen/qwen3.8-27b, <<: *cf, order: 9 }

  # ---------- free-smart: "think hard" ----------
  # 2026-10-08: Kimi K3 (NVIDIA) first: ~3 s, proper tool calls, and it saves Gemini Pro's small free daily allowance.
  - model_name: free-smart
    litellm_params: { model: gemini/gemini-pro-latest, api_key: os.environ/GEMINI_API_KEY, order: 2 }
  - model_name: free-smart
    litellm_params: { model: openai/z-ai/glm-5.3, <<: *nim, order: 3 }
  - model_name: free-smart
    litellm_params: { model: openrouter/nvidia/nemotron-3-super-120b-a12b:free, api_key: os.environ/OPENROUTER_API_KEY, order: 4 }
  - model_name: free-smart
    litellm_params: { model: groq/openai/gpt-oss-120b, api_key: os.environ/GROQ_API_KEY, order: 5 }
  - model_name: free-smart
    litellm_params: { model: openai/@cf/openai/gpt-oss-120b, <<: *cf, order: 6 }
  - model_name: free-smart
    litellm_params: { model: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free, api_key: os.environ/OPENROUTER_API_KEY, order: 7 }  # 2026-10-11: 550B, free on OpenRouter
  - model_name: free-smart
    litellm_params: { model: openai/@cf/nvidia/nemotron-3-120b-a12b, <<: *cf, order: 8 }  # 2026-10-16

  # ---------- free-coder: code ----------
  # 2026-10-07: Mistral Codestral first. It takes opencode's ~11k-token requests (instructions + tools) in ~1 s with proper
  # tool calls; Groq's free tier rejects anything that big (413) and Gemini was often "high demand" (503), which made
  # every opencode step wait 35-100 s while the switch fell down the list. Cloudflare stays last (LiteLLM bug on its
  # streamed tool calls).
  - model_name: free-coder
    litellm_params: { model: mistral/codestral-latest, api_key: os.environ/MISTRAL_API_KEY, order: 1 }
  - model_name: free-coder
    litellm_params: { model: openai/z-ai/glm-5.3, <<: *nim, order: 2 }
  - model_name: free-coder
    litellm_params: { model: groq/openai/gpt-oss-120b, api_key: os.environ/GROQ_API_KEY, order: 4 }
  - model_name: free-coder
    litellm_params: { model: gemini/gemini-flash-latest, api_key: os.environ/GEMINI_API_KEY, order: 5 }
  - model_name: free-coder
    litellm_params: { model: openrouter/poolside/laguna-s-2.1:free, api_key: os.environ/OPENROUTER_API_KEY, order: 6 }
  - model_name: free-coder
    litellm_params: { model: openai/@cf/qwen/qwen2.5-coder-32b-instruct, <<: *cf, order: 7 }

  # ---------- free-vision: looking at pictures ----------
  - model_name: free-vision
    litellm_params: { model: gemini/gemini-flash-latest, api_key: os.environ/GEMINI_API_KEY, order: 1 }
  - model_name: free-vision
    litellm_params: { model: openai/gemma4:31b, <<: *ollamacloud, order: 2 }
  - model_name: free-vision
    litellm_params: { model: openrouter/google/gemma-4-31b-it:free, api_key: os.environ/OPENROUTER_API_KEY, order: 3 }

  - model_name: free-vision
    litellm_params: { model: openai/@cf/meta/llama-4-scout-17b-16e-instruct, <<: *cf, order: 4 }  # 2026-10-16
  # ---------- free-long: very long documents ----------
  - model_name: free-long
    litellm_params: { model: gemini/gemini-flash-latest, api_key: os.environ/GEMINI_API_KEY, order: 1 }
  - model_name: free-long
    litellm_params: { model: openrouter/nvidia/nemotron-3-super-120b-a12b:free, api_key: os.environ/OPENROUTER_API_KEY, order: 3 }
  - model_name: free-long
    litellm_params: { model: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free, api_key: os.environ/OPENROUTER_API_KEY, order: 4 }  # 2026-10-11: 550B, free on OpenRouter

  # ---------- local (no internet): the Ubuntu PC's Ollama on the RTX 5060 (2026-10-15 upgrade) ----------
  - model_name: local-chat
    litellm_params: { model: ollama_chat/llama3.2:3b, api_base: http://127.0.0.1:11434 }
  - model_name: local-smart
    litellm_params: { model: ollama_chat/qwen3:8b, api_base: http://127.0.0.1:11434 }  # 2026-10-16: was llama3.1:8b; qwen3:8b fits the RTX 5060
  - model_name: local-coder
    litellm_params: { model: ollama_chat/qwen2.5-coder:7b, api_base: http://127.0.0.1:11434 }
  - model_name: local-vision
    litellm_params: { model: ollama_chat/qwen3-vl:8b, api_base: http://127.0.0.1:11434 }
  - model_name: local-big
    litellm_params: { model: ollama_chat/gpt-oss:20b, api_base: http://127.0.0.1:11434 }
  - model_name: local-think
    litellm_params: { model: ollama_chat/deepseek-r1:14b, api_base: http://127.0.0.1:11434 }

  # Cohere trial key (2026-10-16): free, no card, 1,000 calls/MONTH, 20/min, personal use only. Named brains + last-resort fallback.
  - model_name: cohere
    litellm_params: { model: cohere_chat/command-a-03-2025, api_key: os.environ/COHERE_API_KEY }
  - model_name: cohere-think
    litellm_params: { model: cohere_chat/command-a-reasoning-08-2025, api_key: os.environ/COHERE_API_KEY }
  - model_name: free-chat
    litellm_params: { model: cohere_chat/command-a-03-2025, api_key: os.environ/COHERE_API_KEY, order: 10 }
  # Cloudflare free models by name (2026-10-16), for picking one directly in Open WebUI.
  - model_name: cf-nemotron
    litellm_params: { model: openai/@cf/nvidia/nemotron-3-120b-a12b, <<: *cf }
  - model_name: cf-qwen
    litellm_params: { model: openai/@cf/qwen/qwen3.8-27b, <<: *cf }
  - model_name: cf-gemma
    litellm_params: { model: openai/@cf/google/gemma-4-26b-a4b-it, <<: *cf }
  - model_name: cf-scout-vision
    litellm_params: { model: openai/@cf/meta/llama-4-scout-17b-16e-instruct, <<: *cf }
  - model_name: cf-mistral
    litellm_params: { model: openai/@cf/mistralai/mistral-small-3.1-24b-instruct, <<: *cf }
  # Ollama Cloud, free plan (2026-10-16): big models on Ollama's servers via the local Ollama. Monthly starter quota,
  # so these are separate named brains, NOT in any fallback chain. Paid-only ones (deepseek, glm, kimi, minimax) left out.
  - model_name: cloud-giant
    litellm_params: { model: ollama_chat/gpt-oss:120b-cloud, api_base: http://127.0.0.1:11434 }
  - model_name: cloud-nemotron
    litellm_params: { model: ollama_chat/nemotron-3-super:cloud, api_base: http://127.0.0.1:11434 }
  - model_name: cloud-gemma
    litellm_params: { model: ollama_chat/gemma4:31b-cloud, api_base: http://127.0.0.1:11434 }
router_settings:
  num_retries: 5            # walk down the `order` list
  timeout: 90
  allowed_fails: 1          # a brain that errors (e.g. out of free uses) sits out...
  cooldown_time: 300        # ...for 5 minutes
  enable_pre_call_checks: true
  fallbacks:
    - { free-chat: [local-chat] }
    - { free-smart: [local-smart] }
    - { free-coder: [local-coder] }
    - { free-vision: [local-vision] }
    - { free-long: [local-big] }
    - { cloud-gemma: [free-chat] }     # Joshua's comedy brain; falls back when the monthly cloud quota runs out

litellm_settings:
  drop_params: true         # ignore options a brain doesn't support instead of failing
  telemetry: false
  callbacks: usage_log.proxy_handler_instance   # logbook for Mission Control METERS (2026-10-11)
