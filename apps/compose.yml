# Free apps for Rabbid, data on the Seagate (OmarchyExt1/apps). All bound to 127.0.0.1 (this laptop only)
# until Rabbid decides on family access. 2026-10-12: started by app-stack.service AFTER the Seagate mounts (restart: "no"; Docker starting them at boot made a blank stand-in OmarchyExt1).
services:
  open-webui:         # ChatGPT-style window for the free local models
    image: ghcr.io/open-webui/open-webui:main
    container_name: app-open-webui
    network_mode: host
    environment: { PORT: "3080", HOST: 127.0.0.1, OLLAMA_BASE_URL: "http://127.0.0.1:11434", WEBUI_NAME: "Ten Forward", SCARF_NO_ANALYTICS: "true", DO_NOT_TRACK: "true", ANONYMIZED_TELEMETRY: "false" }
    env_file: [ ${HOME}/AppData/open-webui.env ]   # brain switch + Auto + GPU pictures + butler voice (2026-10-15)
    volumes: [ "${HOME}/AppData/open-webui:/app/backend/data" ]
    restart: "no"

  open-notebook:      # your own NotebookLM, on the free local models
    image: lfnovo/open_notebook:v1-latest-single
    container_name: app-open-notebook
    network_mode: host
    environment: { OLLAMA_API_BASE: "http://127.0.0.1:11434", API_URL: "http://127.0.0.1:5055", API_HOST: 127.0.0.1, FRONTEND_BIND_HOST: 127.0.0.1,
      SURREAL_URL: "ws://127.0.0.1:8010/rpc", SURREAL_USER: root, SURREAL_PASSWORD: root, SURREAL_NAMESPACE: open_notebook, SURREAL_DATABASE: production }
    volumes: [ "${HOME}/AppData/open-notebook:/app/data", "${HOME}/AppData/open-notebook/surreal:/mydata",
      "${HOME}/AppData/open-notebook/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf:ro" ]
    restart: "no"

  audiobookshelf:     # family audiobook streaming (books are read-only)
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: app-audiobookshelf
    ports: [ "127.0.0.1:13378:80" ]
    volumes: [ "/mnt/storage/Audiobooks:/audiobooks:ro", "${HOME}/AppData/audiobookshelf/config:/config", "${HOME}/AppData/audiobookshelf/metadata:/metadata" ]
    restart: "no"

  filebrowser:        # files from the phone/iPad: ONLY the Seagate's shared folders + Downloads
    image: filebrowser/filebrowser:latest
    container_name: app-filebrowser
    user: "1000:1000"
    ports: [ "127.0.0.1:8085:80" ]
    volumes: [ "/mnt/storage/experiments:/srv/Seagate-experiments", "/mnt/storage/ai:/srv/Seagate-ai", "${HOME}/Downloads:/srv/Downloads", "${HOME}/AppData/filebrowser:/database" ]
    environment: { FB_DATABASE: /database/filebrowser.db, FB_NOAUTH: "false" }
    restart: "no"

  freshrss:           # your own news feed, no algorithm
    image: freshrss/freshrss:latest
    container_name: app-freshrss
    ports: [ "127.0.0.1:8086:80" ]
    environment: { TZ: America/New_York, CRON_MIN: "*/30" }
    volumes: [ "${HOME}/AppData/freshrss/data:/var/www/FreshRSS/data", "${HOME}/AppData/freshrss/extensions:/var/www/FreshRSS/extensions" ]
    restart: "no"

  forgejo:            # safe home for your projects' code (community-run GitHub)
    image: codeberg.org/forgejo/forgejo:11
    container_name: app-forgejo
    ports: [ "127.0.0.1:3001:3000" ]
    environment: { USER_UID: "1000", USER_GID: "1000", FORGEJO__server__ROOT_URL: "http://127.0.0.1:3001/", FORGEJO__server__DISABLE_SSH: "true", FORGEJO__service__DISABLE_REGISTRATION: "true", FORGEJO__security__INSTALL_LOCK: "true", FORGEJO__database__DB_TYPE: sqlite3 }
    volumes: [ "${HOME}/AppData/forgejo:/data" ]
    restart: "no"

  stirling-pdf:       # PDF toolkit: merge, split, sign, convert
    image: docker.stirlingpdf.com/stirlingtools/stirling-pdf:latest
    container_name: app-stirling-pdf
    ports: [ "127.0.0.1:8087:8080" ]
    environment: { DOCKER_ENABLE_SECURITY: "false", SYSTEM_DEFAULTLOCALE: en-US }
    volumes: [ "${HOME}/AppData/stirling-pdf/configs:/configs", "${HOME}/AppData/stirling-pdf/data:/usr/share/tessdata" ]
    restart: "no"

  libretranslate:     # offline translation (English, Spanish, French, German, Italian, Portuguese, Chinese, Japanese)
    image: libretranslate/libretranslate:latest
    container_name: app-libretranslate
    ports: [ "127.0.0.1:5100:5000" ]
    environment: { LT_LOAD_ONLY: "en,es,fr,de,it,pt,zh,ja", LT_UPDATE_MODELS: "false" }
    volumes: [ "${HOME}/AppData/libretranslate:/home/libretranslate/.local" ]
    restart: "no"

  vane:               # Vane (was Perplexica): fast answers with sources, like Perplexity. Your SearXNG + free brains. Added 2026-10-16.
    image: itzcrazykns1337/vane:slim-latest
    container_name: app-vane
    restart: unless-stopped
    network_mode: host   # reaches SearXNG 8888, brain switch 4000, Ollama 11434 on 127.0.0.1
    environment:
      HOSTNAME: 127.0.0.1
      PORT: "3005"
      SEARXNG_API_URL: http://127.0.0.1:8888
    volumes:
      - ${HOME}/AppData/vane:/home/vane/data
  kiwix:              # Offline Library: Wikipedia, WikiMed, iFixit, Stack Exchange, survival guides, books (on the Seagate)
    image: ghcr.io/kiwix/kiwix-serve:latest
    container_name: app-kiwix
    ports: [ "127.0.0.1:8090:8080" ]
    # Build the catalog book by book so one broken file is skipped instead of crashing the server (*.zim skips .part files).
    # 2026-10-20: a book with a finished speed copy on the NVMe (/fast, made by library-fast-sync) is served from there.
    entrypoint: [ "sh", "-c", "rm -f /tmp/lib.xml; for f in /data/*.zim; do b=$${f##*/}; [ -f \"/fast/$$b\" ] && f=\"/fast/$$b\"; kiwix-manage /tmp/lib.xml add \"$$f\" >/dev/null 2>&1 || echo \"skipping broken book: $$f\"; done; exec kiwix-serve --port 8080 --threads 16 --library /tmp/lib.xml" ]
    volumes: [ "/mnt/storage/Offline Library/Wikipedia and more (zim files):/data:ro", "${HOME}/AppData/kiwix-fast:/fast:ro" ]
    restart: "no"

  maps:               # Offline Maps: Project NOMAD's US state maps (OpenStreetMap), viewer in apps/maps/ (on the Seagate)
    image: nginx:alpine
    container_name: app-maps
    ports: [ "127.0.0.1:8091:8080" ]
    volumes: [ "/mnt/storage/Offline Maps:/maps:ro", "./maps/index.html:/viewer/index.html:ro", "./maps/nginx.conf:/etc/nginx/conf.d/default.conf:ro" ]
    restart: "no"

  brain-switch:       # LiteLLM: one address (127.0.0.1:4000/v1) for all the free AI brains, cloud first, local when offline
    image: ghcr.io/berriai/litellm:main-stable
    container_name: app-brain-switch
    network_mode: host
    env_file: [ ${HOME}/.config/crew/ai-keys.env, ./brain-switch/extra.env ]
    environment: { LITELLM_TELEMETRY: "False", NO_DOCS: "True", DISABLE_ADMIN_UI: "True" }
    # 2026-10-16: active.yaml -> config.yaml (online) or config-offline.yaml (internet down: local brains + bookshelf);
    # net-watch flips it and restarts this container.
    volumes: [ "./brain-switch:/app/bs:ro", "${HOME}/.local/share/crew/brain-usage:/data" ]
    command: [ "--config", "/app/bs/active.yaml", "--host", "127.0.0.1", "--port", "4000" ]
    restart: "no"
