# Free apps for Rabbid, data on the Seagate (OmarchyExt1/apps). All bound to 127.0.0.1 (this laptop only)
# until Rabbid decides on family access. They come back up with Docker after login (restart: unless-stopped).
services:
  open-webui:         # ChatGPT-style window for the free local models
    image: ghcr.io/open-webui/open-webui:main
    container_name: app-open-webui
    network_mode: host
    environment: { PORT: "3080", HOST: 127.0.0.1, OLLAMA_BASE_URL: "http://127.0.0.1:11434", WEBUI_NAME: "Rick's Lab", ENABLE_OPENAI_API: "false", SCARF_NO_ANALYTICS: "true", DO_NOT_TRACK: "true", ANONYMIZED_TELEMETRY: "false" }
    volumes: [ "/run/media/${USER}/OmarchyExt1/apps/open-webui:/app/backend/data" ]
    restart: unless-stopped

  open-notebook:      # your own NotebookLM, on the free local models
    image: lfnovo/open_notebook:v1-latest-single
    container_name: app-open-notebook
    network_mode: host
    environment: { OLLAMA_API_BASE: "http://127.0.0.1:11434", API_URL: "http://127.0.0.1:5055", API_HOST: 127.0.0.1, FRONTEND_BIND_HOST: 127.0.0.1,
      SURREAL_URL: "ws://127.0.0.1:8010/rpc", SURREAL_USER: root, SURREAL_PASSWORD: root, SURREAL_NAMESPACE: open_notebook, SURREAL_DATABASE: production }
    volumes: [ "/run/media/${USER}/OmarchyExt1/apps/open-notebook:/app/data", "/run/media/${USER}/OmarchyExt1/apps/open-notebook/surreal:/mydata",
      "/run/media/${USER}/OmarchyExt1/apps/open-notebook/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf:ro" ]
    restart: unless-stopped

  audiobookshelf:     # family audiobook streaming (books are read-only)
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: app-audiobookshelf
    ports: [ "127.0.0.1:13378:80" ]
    volumes: [ "${HOME}/Audiobooks:/audiobooks:ro", "/run/media/${USER}/OmarchyExt1/apps/audiobookshelf/config:/config", "/run/media/${USER}/OmarchyExt1/apps/audiobookshelf/metadata:/metadata" ]
    restart: unless-stopped

  filebrowser:        # files from the phone/iPad: ONLY the Seagate's shared folders + Downloads
    image: filebrowser/filebrowser:latest
    container_name: app-filebrowser
    user: "1000:1000"
    ports: [ "127.0.0.1:8085:80" ]
    volumes: [ "/run/media/${USER}/OmarchyExt1/experiments:/srv/Seagate-experiments", "/run/media/${USER}/OmarchyExt1/ai:/srv/Seagate-ai", "${HOME}/Downloads:/srv/Downloads", "/run/media/${USER}/OmarchyExt1/apps/filebrowser:/database" ]
    environment: { FB_DATABASE: /database/filebrowser.db, FB_NOAUTH: "false" }
    restart: unless-stopped

  freshrss:           # your own news feed, no algorithm
    image: freshrss/freshrss:latest
    container_name: app-freshrss
    ports: [ "127.0.0.1:8086:80" ]
    environment: { TZ: America/New_York, CRON_MIN: "*/30" }
    volumes: [ "/run/media/${USER}/OmarchyExt1/apps/freshrss/data:/var/www/FreshRSS/data", "/run/media/${USER}/OmarchyExt1/apps/freshrss/extensions:/var/www/FreshRSS/extensions" ]
    restart: unless-stopped

  forgejo:            # safe home for your projects' code (community-run GitHub)
    image: codeberg.org/forgejo/forgejo:11
    container_name: app-forgejo
    ports: [ "127.0.0.1:3001:3000" ]
    environment: { USER_UID: "1000", USER_GID: "1000", FORGEJO__server__ROOT_URL: "http://127.0.0.1:3001/", FORGEJO__server__DISABLE_SSH: "true", FORGEJO__service__DISABLE_REGISTRATION: "true", FORGEJO__security__INSTALL_LOCK: "true", FORGEJO__database__DB_TYPE: sqlite3 }
    volumes: [ "/run/media/${USER}/OmarchyExt1/apps/forgejo:/data" ]
    restart: unless-stopped

  stirling-pdf:       # PDF toolkit: merge, split, sign, convert
    image: docker.stirlingpdf.com/stirlingtools/stirling-pdf:latest
    container_name: app-stirling-pdf
    ports: [ "127.0.0.1:8087:8080" ]
    environment: { DOCKER_ENABLE_SECURITY: "false", SYSTEM_DEFAULTLOCALE: en-US }
    volumes: [ "/run/media/${USER}/OmarchyExt1/apps/stirling-pdf/configs:/configs", "/run/media/${USER}/OmarchyExt1/apps/stirling-pdf/data:/usr/share/tessdata" ]
    restart: unless-stopped

  libretranslate:     # offline translation (English, Spanish, French, German, Italian, Portuguese, Chinese, Japanese)
    image: libretranslate/libretranslate:latest
    container_name: app-libretranslate
    ports: [ "127.0.0.1:5100:5000" ]
    environment: { LT_LOAD_ONLY: "en,es,fr,de,it,pt,zh,ja", LT_UPDATE_MODELS: "false" }
    volumes: [ "/run/media/${USER}/OmarchyExt1/apps/libretranslate:/home/libretranslate/.local" ]
    restart: unless-stopped

  kiwix:              # Offline Library: Wikipedia, WikiMed, iFixit, Stack Exchange, survival guides, books (on the Seagate)
    image: ghcr.io/kiwix/kiwix-serve:latest
    container_name: app-kiwix
    ports: [ "127.0.0.1:8090:8080" ]
    # Build the catalog book by book so one broken file is skipped instead of crashing the server (*.zim skips .part files).
    entrypoint: [ "sh", "-c", "rm -f /tmp/lib.xml; for f in /data/*.zim; do kiwix-manage /tmp/lib.xml add \"$$f\" >/dev/null 2>&1 || echo \"skipping broken book: $$f\"; done; exec kiwix-serve --port 8080 --library /tmp/lib.xml" ]
    volumes: [ "/run/media/${USER}/OmarchyExt1/Offline Library/Wikipedia and more (zim files):/data:ro" ]
    restart: unless-stopped

  maps:               # Offline Maps: Project NOMAD's US state maps (OpenStreetMap), viewer in apps/maps/ (on the Seagate)
    image: nginx:alpine
    container_name: app-maps
    ports: [ "127.0.0.1:8091:8080" ]
    volumes: [ "/run/media/${USER}/OmarchyExt1/Offline Maps:/maps:ro", "./maps/index.html:/viewer/index.html:ro", "./maps/nginx.conf:/etc/nginx/conf.d/default.conf:ro" ]
    restart: unless-stopped

  brain-switch:       # LiteLLM: one address (127.0.0.1:4000/v1) for all the free AI brains, cloud first, local when offline
    image: ghcr.io/berriai/litellm:main-stable
    container_name: app-brain-switch
    network_mode: host
    env_file: [ ${HOME}/.config/crew/ai-keys.env, ./brain-switch/extra.env ]
    environment: { LITELLM_TELEMETRY: "False", NO_DOCS: "True", DISABLE_ADMIN_UI: "True" }
    volumes: [ "./brain-switch/config.yaml:/app/config.yaml:ro" ]
    command: [ "--config", "/app/config.yaml", "--host", "127.0.0.1", "--port", "4000" ]
    restart: unless-stopped
